[project]
name = "cbm-eval"
version = "0.1.0"
description = "Research code for a controlled design study of concept bottleneck models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
clip = ["open_clip_torch>=2.24"]
hf = ["transformers>=4.40"]
llm = ["anthropic>=0.40"]
analysis = ["statsmodels>=0.14"]
dev = ["pytest>=8.0"]

[project.scripts]
cbm-eval = "cbm_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cbm_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
