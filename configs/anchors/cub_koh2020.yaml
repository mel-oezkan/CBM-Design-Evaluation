# Koh et al. 2020, "Concept Bottleneck Models" (ICML), CUB, JOINT bottleneck (Table 1: 0.199 task error,
# Table 2: 0.031 concept error). Siblings: cub_koh2020_independent.yaml, cub_koh2020_sequential.yaml.
#
# Matched: authors' train/val split and 112 class-level concepts voted as in their code
#   (`split_dir` = CUB_processed/class_attr_data_10 from their Codalab worksheet
#   0x362911581fcd4e048ddfd84f47203fd2; `majority_vote: koh`); Inception-v3 (ImageNet) fine-tuned
#   end to end with SGD (momentum 0.9, weight decay 4e-4, batch 64) and their augmentation; linear
#   c -> y head on concept logits; imbalance-weighted concept BCE; lambda = 0.01 (their concept loss
#   sums over the 112 concepts, ours averages, so concept_weight = 0.01 * 112). They divide the loss
#   by 1 + lambda * 112 = 2.12 and we do not, so the encoder lr is 0.001 / 2.12.
# Remaining gaps:
#   - model selection: early stopping on the val loss (ours) vs. up to 1000 epochs, retrained on
#     train+val and picked by training accuracy (theirs); concept layer and head use Adam (ours) vs. SGD
#     (`stages.training.optimizer: sgd` expresses theirs; not set, to keep this anchor's run id);
#   - no auxiliary Inception head (theirs: 0.4 x aux loss); ImageNet input normalization (theirs:
#     mean 0.5 / std 2); eval images resized to 299 (theirs: center crop without resizing);
#   - interventions (leakage evaluator) replace random single concepts, not visibility-aware groups.
name: cub_koh2020
dataset: {name: cub, root: data/CUB_200_2011, majority_vote: koh, split_dir: data/CUB_processed/class_attr_data_10}
backbone: {name: inception}
stages:
  discovery: {name: dataset}
  filtering: [{name: rules, remove_class_names: false, max_words: 10}]
  generation: {name: logits}
  alignment: {name: human}
  predictor: {name: dense}
  training:
    name: joint_weighted
    concept_weight: 1.12
    device: auto
    finetune: {epochs: 300, lr: 0.00047, optimizer: sgd, momentum: 0.9, weight_decay: 0.0004, batch_size: 64,
               patience: 30, num_workers: 8}
evaluation:
  - {name: shift, splits: [test]}
  - {name: concepts}
  - {name: leakage}
paths: {cache: .cache, runs: runs/cub_koh2020, results: results/cub_koh2020.jsonl}
