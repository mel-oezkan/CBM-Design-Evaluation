# Koh et al. 2020, "Concept Bottleneck Models" (ICML), CUB, JOINT bottleneck (Table 1: 0.199 task error,
# Table 2: 0.031 concept error). Siblings: cub_koh2020_independent.yaml, cub_koh2020_sequential.yaml.
# The frozen arm (cub_koh2020_frozen*.yaml) uses the same recipe without fine-tuning.
#
# Matched: authors' train/val split and 112 class-level concepts voted as in their code
#   (`split_dir` = CUB_processed/class_attr_data_10 from their Codalab worksheet
#   0x362911581fcd4e048ddfd84f47203fd2; `majority_vote: koh`); Inception-v3 (ImageNet) fine-tuned
#   end to end with their augmentation; inputs scaled by mean 0.5 / std 2 before transform_input and
#   eval images center-cropped to 299 without resizing; one SGD setup (lr 0.001, momentum 0.9, weight
#   decay 4e-4, batch 64 without the last partial batch) for encoder, concept layer, auxiliary head and
#   c -> y head; 112 linear concept units on the raw pooled features after the encoder's own dropout 0.5,
#   weights ~ truncnorm(std 0.1); linear c -> y head on unclamped concept logits (`raw: true`, issue #47);
#   imbalance-weighted concept BCE; lambda = 0.01 (their concept loss sums over the 112 concepts, ours
#   averages, so concept_weight = 0.01 * 112); loss divided by 1 + lambda * 112 (`normalize_loss`).
#   Auxiliary Inception head on Mixed_6e (`aux`, their -use_aux) on the raw tap features: 0.4 x the same
#   loss on its concept logits, which also pass through the shared c -> y head. Trained on train + val
#   for up to 1000 epochs, keeping the epoch with the best running training task accuracy and stopping
#   after 100 epochs without one (their -ckpt 1).
# Remaining gaps:
#   - interventions (leakage evaluator) replace random single concepts, not visibility-aware groups.
name: cub_koh2020
dataset: {name: cub, root: data/CUB_200_2011, majority_vote: koh, split_dir: data/CUB_processed/class_attr_data_10}
backbone: {name: inception, mean: [0.5, 0.5, 0.5], std: [2, 2, 2], eval_resize: false}
stages:
  discovery: {name: dataset}
  filtering: [{name: rules, remove_class_names: false, max_words: 10}]
  generation: {name: logits, raw: true, standardize: false, init_std: 0.1}  # dropout: the encoder's own
  alignment: {name: human}
  predictor: {name: dense}
  training:
    name: joint_weighted
    concept_weight: 1.12
    normalize_loss: true
    optimizer: sgd
    lr: 0.001
    momentum: 0.9
    weight_decay: 0.0004
    batch_size: 64
    select: train_acc
    train_on_val: true
    aux: {weight: 0.4, init_std: 0.001, standardize: false}
    device: auto
    finetune: {epochs: 1000, lr: 0.001, optimizer: sgd, momentum: 0.9, weight_decay: 0.0004, batch_size: 64,
               patience: 100, num_workers: 8}
evaluation:
  - {name: shift, splits: [test]}
  - {name: concepts}
  - {name: leakage}
paths: {cache: .cache, runs: runs/cub_koh2020, results: results/cub_koh2020.jsonl}
