# Runs the architecture reviewer (.claude/agents/architecture-reviewer.md) on every commit of one PR
# and posts its report as a PR comment. Manual only: run it for PRs that change the architecture,
#   gh workflow run architecture-review.yml -f pr=<number>
# Advisory: it never blocks merging. Needs the repository secret ANTHROPIC_API_KEY.
name: Architecture review

on:
  workflow_dispatch:
    inputs:
      pr:
        description: "Number of the pull request to review"
        required: true
        type: number

concurrency:
  group: architecture-review-${{ inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Check the API key
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::Set the repository secret ANTHROPIC_API_KEY (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Find the PR's commit range
        id: range
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr view ${{ inputs.pr }} --repo ${{ github.repository }} \
            --json baseRefOid,headRefOid --jq '"base=\(.baseRefOid)\nhead=\(.headRefOid)"' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.range.outputs.head }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}  # the workflow's own token, so the Claude GitHub App is not needed
          prompt: |
            Read .claude/agents/architecture-reviewer.md and act as that reviewer, following its
            instructions exactly.

            Target: PR #${{ inputs.pr }} in ${{ github.repository }},
            commit range ${{ steps.range.outputs.base }}..${{ steps.range.outputs.head }}.

            When the report is complete, post it as one PR comment with
            `gh pr comment ${{ inputs.pr }} --body-file <file>`
            (write the report to a file first). Do not edit, commit or push anything.
          claude_args: |
            --allowedTools "Read,Grep,Glob,Write,Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(uv run pytest:*),Bash(uv run cbm-eval list:*),Bash(uv run --group docs properdocs build:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh issue list:*)"
